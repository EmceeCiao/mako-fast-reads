name: Multi-Shard Follower Read Evaluation

on:
  workflow_dispatch:
    inputs:
      nshards:
        description: 'Number of shards (2, 3, or 4)'
        required: false
        default: '3'
      threads:
        description: 'Threads per replica'
        required: false
        default: '2'
      runtime:
        description: 'Runtime in seconds'
        required: false
        default: '60'
      fast_ro_mode:
        description: 'Fast RO mode (fast or blank for baseline)'
        required: false
        default: 'fast'

jobs:
  multishard-eval:
    runs-on: [self-hosted, linux, c-ci-runner]
    timeout-minutes: 20   # Prevent hanging - 20 min max

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Rust 1.91 into PATH
        run: |
          if [ -x /usr/local/bin/rustc ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          fi
          if [ -x "$HOME/.local-rust/bin/rustc" ]; then
            echo "$HOME/.local-rust/bin" >> "$GITHUB_PATH"
          fi

      - name: Link Build Target to SSD
        run: |
          echo "Linking Session to NVMe SSD"
          sudo mkdir -p /mnt/nvme-build/mako_target
          sudo chown -R $USER:$USER /mnt/nvme-build
          ln -s /mnt/nvme-build/mako_target $GITHUB_WORKSPACE/target || true

      - name: Build
        run: make -j32

      - name: Cleanup Previous State
        run: |
          pkill -9 dbtest 2>/dev/null || true
          pkill -9 simplePaxos 2>/dev/null || true
          pkill -9 -f "bash/shard.sh" 2>/dev/null || true
          rm -f nfs_sync_* 2>/dev/null || true
          rm -rf /tmp/${USER}_mako_rocksdb_shard* 2>/dev/null || true
          sleep 2

      - name: Run Multi-Shard Evaluation
        env:
          NSHARDS: ${{ github.event.inputs.nshards }}
          THREADS: ${{ github.event.inputs.threads }}
          RUNTIME: ${{ github.event.inputs.runtime }}
          MAKO_TPCC_WORKLOAD_MIX: "10,10,0,40,40"
          MAKO_FAST_RO_MODE: ${{ github.event.inputs.fast_ro_mode }}
          RESULT_DIR: results/multishard_follower_eval
        run: |
          chmod +x scripts/run_multishard_follower_read_eval.sh
          bash scripts/run_multishard_follower_read_eval.sh
        timeout-minutes: 10

      - name: Display Results
        if: always()
        run: |
          echo "=== Results Summary ==="
          if [ -f results/multishard_follower_eval/summary.txt ]; then
            cat results/multishard_follower_eval/summary.txt
          else
            echo "No summary file found"
            echo "Checking for log files..."
            ls -la results/multishard_follower_eval/ 2>/dev/null || echo "No results directory"
          fi

      - name: Final Cleanup
        if: always()
        run: |
          pkill -9 dbtest 2>/dev/null || true
          pkill -9 simplePaxos 2>/dev/null || true
          pkill -9 -f "bash/shard.sh" 2>/dev/null || true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multishard-logs-${{ github.run_id }}
          path: results/multishard_follower_eval/
          if-no-files-found: ignore
