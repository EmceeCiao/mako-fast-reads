name: Multi-Shard Follower Read Evaluation

on:
  workflow_dispatch:
    inputs:
      nshards:
        description: 'Number of shards (default: 4)'
        required: false
        default: '4'
      threads:
        description: 'Threads per replica (default: 2)'
        required: false
        default: '2'
      runtime:
        description: 'Runtime in seconds (default: 60)'
        required: false
        default: '60'
      comparison_mode:
        description: 'Run comparison (baseline vs fast-path)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  multishard-follower-eval:
    runs-on: [self-hosted, linux, c-ci-runner]
    env:
      RESULT_DIR: results/multishard_follower_eval
      RESULT_BASE_DIR: results/multishard_comparison

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Rust 1.91 into PATH
        run: |
          if [ -x /usr/local/bin/rustc ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          fi
          if [ -x "$HOME/.local-rust/bin/rustc" ]; then
            echo "$HOME/.local-rust/bin" >> "$GITHUB_PATH"
          fi

      - name: Link Build Target to SSD
        run: |
          echo "Linking Session to NVMe SSD"
          sudo mkdir -p /mnt/nvme-build/mako_target
          sudo chown -R $USER:$USER /mnt/nvme-build
          ln -s /mnt/nvme-build/mako_target $GITHUB_WORKSPACE/target || true
          echo "LINKED!"

      - name: Build
        run: make -j32

      - name: Multi-Shard Follower Read Comparison
        if: ${{ github.event.inputs.comparison_mode == 'true' }}
        env:
          NSHARDS: ${{ github.event.inputs.nshards }}
          NREPLICAS: 4
          THREADS: ${{ github.event.inputs.threads }}
          RUNTIME: ${{ github.event.inputs.runtime }}
          MAKO_TPCC_WORKLOAD_MIX: "10,10,0,40,40"
          RESULT_BASE_DIR: ${{ env.RESULT_BASE_DIR }}
        run: |
          chmod +x scripts/compare_follower_read_benefit.sh
          chmod +x scripts/run_multishard_follower_read_eval.sh
          bash scripts/compare_follower_read_benefit.sh

      - name: Multi-Shard Fast-Path Only
        if: ${{ github.event.inputs.comparison_mode == 'false' }}
        env:
          NSHARDS: ${{ github.event.inputs.nshards }}
          NREPLICAS: 4
          THREADS: ${{ github.event.inputs.threads }}
          RUNTIME: ${{ github.event.inputs.runtime }}
          MAKO_TPCC_WORKLOAD_MIX: "10,10,0,40,40"
          MAKO_FAST_RO_MODE: "fast"
          RESULT_DIR: ${{ env.RESULT_DIR }}
        run: |
          chmod +x scripts/run_multishard_follower_read_eval.sh
          bash scripts/run_multishard_follower_read_eval.sh

      - name: Display Results Summary
        if: always()
        run: |
          echo "=== Evaluation Results ==="
          if [ -f "${{ env.RESULT_BASE_DIR }}/comparison_summary.txt" ]; then
            cat "${{ env.RESULT_BASE_DIR }}/comparison_summary.txt"
          elif [ -f "${{ env.RESULT_DIR }}/summary.txt" ]; then
            cat "${{ env.RESULT_DIR }}/summary.txt"
          else
            echo "No summary file found"
          fi

      - name: Upload Evaluation Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multishard-follower-logs-${{ github.run_id }}
          path: |
            ${{ env.RESULT_DIR }}
            ${{ env.RESULT_BASE_DIR }}
          if-no-files-found: ignore
