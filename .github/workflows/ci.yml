name: CI

on:
  workflow_dispatch:

# Cancel superseded runs when you push new commits to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, c-ci-runner]

    env:
      RUN_INDEX: 1     # 1, 2, or 3 (per matrix job)
      RUN_NUM: ${{ github.run_number }}       # monotonically increasing per workflow
      RUN_ID: ${{ github.run_id }}            # unique per workflow run
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # if you use submodules (e.g., third-party libs)

      - name: Environments
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "RUN_NUMBER=${{ matrix.run_number }}"
          echo "RUN_NUM=${{ github.run_number }}"
          echo "RUN_ID=${{ github.run_id }}"   
          echo "Running on AWS SPOT Instance" 
          nproc 
          df -h
      
      # # Install Depencies Via Script 
      # - name: Install System Dependencies
      #   run: |
      #     sudo apt-get update
      #     bash apt_packages.sh  # Runs your existing script 
      
      # # Install RustC Version as Specified  
      # - name: Install Rust Version 
      #   run: | 
      #     source install_rustc.sh
      # - name: Install Specific Rust Toolchain 1.91.0
      #   uses: dtolnay/rust-toolchain@v1
      #   with:
      #     toolchain: 1.91.0 # Uses rustup internally to fetch and install the correct version
      #     profile: minimal
      #     override: true   

      - name: Force Rust 1.91 into PATH
        run: |
          # If system-wide in /usr/local/bin:
          if [ -x /usr/local/bin/rustc ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          fi

          # If you installed locally as ubuntu into ~/.local-rust:
          if [ -x "$HOME/.local-rust/bin/rustc" ]; then
            echo "$HOME/.local-rust/bin" >> "$GITHUB_PATH"
          fi
      
      # LINK NVMe SSD 
      - name: Link Build Target to SSD 
        run: | 
          echo "Linking Session to NVMe SSD" 
          sudo mkdir -p /mnt/nvme-build/mako_target 
          sudo chown -R $USER:$USER /mnt/nvme-build 
          ln -s /mnt/nvme-build/mako_target $GITHUB_WORKSPACE/target 
          echo "LINKED!" 
      
      # Make like the instructions say to 
      - name: Making 
        run: make -j32

      # - name: Compile
      #   run: ./ci/ci.sh compile

      # - name: Run tests - RRR unit tests
      #   run: ./ci/ci.sh rrrTests

      # - name: Run tests - simple transaction
      #   run: ./ci/ci.sh simpleTransaction

      # - name: Run tests - simple replication
      #   run: ./ci/ci.sh simplePaxos 

      # - name: Run tests - simple 2 shards without replication (RRR)
      #   run: ./ci/ci.sh shardNoReplication

      # - name: Run tests - simple 2 shards without replication (eRPC)
      #   run: ./ci/ci.sh shardNoReplicationErpc

      # - name: Run tests - simple 1 shard with replication - dbtest
      #   run: ./ci/ci.sh shard1Replication

      # - name: Run tests - simple 2 shard with replication - dbtest (RRR)
      #   run: ./ci/ci.sh shard2Replication

      # - name: Run tests - simple 2 shard with replication - dbtest (eRPC)
      #   run: ./ci/ci.sh shard2ReplicationErpc

      # - name: Run tests - simple 1 shard with replication - simpleTransactionRep
      #   run: ./ci/ci.sh shard1ReplicationSimple
      
      # - name: Run tests - simple 2 shard with replication - simpleTransactionRep
      #   run: ./ci/ci.sh shard2ReplicationSimple

      # - name: Run tests - RocksDB persistence and partitioned queues
      #   run: ./ci/ci.sh rocksdbTests

      # - name: Cleanup
      #   if: always()
      #   run: ./ci/ci.sh cleanup

      - name: Run tests - RRR unit tests
        id: rrrTests
        continue-on-error: true
        run: ./ci/ci.sh rrrTests

      - name: Run tests - simple transaction
        id: simpleTransaction
        continue-on-error: true
        run: ./ci/ci.sh simpleTransaction

      - name: Run tests - simple replication
        id: simplePaxos
        continue-on-error: true
        run: ./ci/ci.sh simplePaxos 

      - name: Run tests - simple 2 shards without replication (RRR)
        id: shardNoReplication
        continue-on-error: true
        run: ./ci/ci.sh shardNoReplication

      - name: Run tests - simple 2 shards without replication (eRPC)
        id: shardNoReplicationErpc
        continue-on-error: true
        run: ./ci/ci.sh shardNoReplicationErpc

      - name: Run tests - simple 1 shard with replication - dbtest
        id: shard1Replication
        continue-on-error: true
        run: ./ci/ci.sh shard1Replication

      # - name: Run tests - simple 2 shard with replication - dbtest (RRR)
      #   id: shard2Replication
      #   continue-on-error: true
      #   run: ./ci/ci.sh shard2Replication

      # - name: Run tests - simple 2 shard with replication - dbtest (eRPC)
      #   id: shard2ReplicationErpc
      #   continue-on-error: true
      #   run: ./ci/ci.sh shard2ReplicationErpc

      - name: Run tests - simple 1 shard with replication - simpleTransactionRep
        id: shard1ReplicationSimple
        continue-on-error: true
        run: ./ci/ci.sh shard1ReplicationSimple
      
      - name: Run tests - simple 2 shard with replication - simpleTransactionRep
        id: shard2ReplicationSimple
        continue-on-error: true
        run: ./ci/ci.sh shard2ReplicationSimple

      - name: Run tests - RocksDB persistence and partitioned queues
        id: rocksdbTests
        continue-on-error: true
        run: ./ci/ci.sh rocksdbTests 


      - name: Cleanup
        if: always()
        run: ./ci/ci.sh cleanup

      - name: Fail job if any tests failed
        if: ${{ always() }}
        run: |
          failed=0

          check() {
            name=$1
            outcome=$2
            if [ "$outcome" != "success" ]; then
              echo "❌ $name failed (outcome=$outcome)"
              failed=1
            else
              echo "✅ $name passed"
            fi
          }

          check "rrrTests"                "${{ steps.rrrTests.outcome }}"
          check "simpleTransaction"       "${{ steps.simpleTransaction.outcome }}"
          check "simplePaxos"             "${{ steps.simplePaxos.outcome }}"
          check "shardNoReplication"      "${{ steps.shardNoReplication.outcome }}"
          check "shardNoReplicationErpc"  "${{ steps.shardNoReplicationErpc.outcome }}"
          check "shard1Replication"       "${{ steps.shard1Replication.outcome }}"
          # check "shard2Replication"       "${{ steps.shard2Replication.outcome }}"
          # check "shard2ReplicationErpc"   "${{ steps.shard2ReplicationErpc.outcome }}"
          check "shard1ReplicationSimple" "${{ steps.shard1ReplicationSimple.outcome }}"
          check "shard2ReplicationSimple" "${{ steps.shard2ReplicationSimple.outcome }}"
          check "rocksdbTests"             "${{ steps.rocksdbTests.outcome }}"

          if [ "$failed" -ne 0 ]; then
            echo "One or more tests failed."
            exit 1
          else
            echo "All tests passed."
          fi
