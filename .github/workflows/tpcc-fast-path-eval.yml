name: TPCC Fast-Path Evaluation

on:
  workflow_dispatch:
    inputs:
      fast_ro_mode:
        description: 'Optional MAKO_FAST_RO_MODE (set to "fast" on fast-path branches, leave blank for baseline)'
        required: false
        default: ''

jobs:
  tpcc-fast-path:
    runs-on: [self-hosted, linux, c-ci-runner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Rust 1.91 into PATH
        run: |
          if [ -x /usr/local/bin/rustc ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          fi
          if [ -x "$HOME/.local-rust/bin/rustc" ]; then
            echo "$HOME/.local-rust/bin" >> "$GITHUB_PATH"
          fi

      - name: Link Build Target to SSD
        run: |
          echo "Linking Session to NVMe SSD"
          sudo mkdir -p /mnt/nvme-build/mako_target
          sudo chown -R $USER:$USER /mnt/nvme-build
          ln -s /mnt/nvme-build/mako_target $GITHUB_WORKSPACE/target || true
          echo "LINKED!"

      - name: Build
        run: make -j32

      - name: TPCC fast-path evaluation (80/20 mix)
        env:
          NSHARDS: 1
          THREADS: 6
          RUNTIME: 60
          MAKO_TPCC_WORKLOAD_MIX: "10,10,0,40,40"
          MAKO_FAST_RO_MODE: ${{ github.event.inputs.fast_ro_mode }}
        run: bash scripts/run_tpcc_fast_path_eval.sh
